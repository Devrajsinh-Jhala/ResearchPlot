name: Publish signed release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed release tag to recover or republish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    environment:
      name: ${{ contains(inputs.release_tag || github.ref_name, 'rc') && 'testpypi' || 'pypi' }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Require a verifiable signed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "$RELEASE_TAG^{tag}")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .verification.verified)" = true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,docs,plots,registry]"
      - name: Verify release candidate
        env:
          MPLBACKEND: Agg
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src
          python -m pytest
          python -m mkdocs build --strict
          python scripts/generate_contract_schemas.py --check
          python scripts/generate_profile_docs.py --check
      - name: Require tag and package versions to match
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          assert project["version"] == expected, (project["version"], expected)
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Prepare release assets
        run: mkdir -p release-assets
      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: cyclonedx-json
          output-file: release-assets/researchplot-${{ env.RELEASE_TAG }}.cdx.json
          upload-artifact: false
      - name: Attest release distributions
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Clean wheel installation
        run: |
          python -m venv /tmp/researchplot-release
          /tmp/researchplot-release/bin/python -m pip install dist/*.whl
          /tmp/researchplot-release/bin/researchplot profile list
          /tmp/researchplot-release/bin/researchplot doctor --profile nature@2026.08.0 --json
      - name: Publish release candidate to TestPyPI
        if: contains(env.RELEASE_TAG, 'rc')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish final release to PyPI
        if: ${{ !contains(env.RELEASE_TAG, 'rc') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Create GitHub release with verified distributions
        if: ${{ !contains(env.RELEASE_TAG, 'rc') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* release-assets/* \
            --verify-tag \
            --title "ResearchPlot ${RELEASE_TAG#v}" \
            --generate-notes
