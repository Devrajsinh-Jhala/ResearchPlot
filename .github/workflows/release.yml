name: Publish signed release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: ${{ contains(github.ref_name, 'rc') && 'testpypi' || 'pypi' }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require a verifiable signed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha="$(git rev-parse "$GITHUB_REF_NAME^{tag}")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .verification.verified)" = true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,docs,plots,registry]"
      - name: Verify release candidate
        env:
          MPLBACKEND: Agg
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src
          python -m pytest
          python -m mkdocs build --strict
          python scripts/generate_contract_schemas.py --check
          python scripts/generate_profile_docs.py --check
      - name: Require tag and package versions to match
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert project["version"] == expected, (project["version"], expected)
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: cyclonedx-json
          output-file: release-assets/researchplot-${{ github.ref_name }}.cdx.json
          upload-artifact: false
      - name: Attest release distributions
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Clean wheel installation
        run: |
          python -m venv /tmp/researchplot-release
          /tmp/researchplot-release/bin/python -m pip install dist/*.whl
          /tmp/researchplot-release/bin/researchplot profile list
          /tmp/researchplot-release/bin/researchplot doctor --profile nature@2026.08.0 --json
      - name: Publish release candidate to TestPyPI
        if: contains(github.ref_name, 'rc')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish final release to PyPI
        if: ${{ !contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Create GitHub release with verified distributions
        if: ${{ !contains(github.ref_name, 'rc') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* release-assets/* \
            --verify-tag \
            --title "ResearchPlot ${GITHUB_REF_NAME#v}" \
            --generate-notes
