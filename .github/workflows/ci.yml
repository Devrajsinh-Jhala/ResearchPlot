name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,plots,registry]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python scripts/generate_contract_schemas.py --check
      - run: python scripts/generate_profile_docs.py --check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.14"
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,plots,registry]"
      - run: python -m pytest

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/researchplot-wheel
          /tmp/researchplot-wheel/bin/python -m pip install dist/*.whl
          /tmp/researchplot-wheel/bin/researchplot profile list
          /tmp/researchplot-wheel/bin/python -c "import researchplot as rp; assert len(rp.list_profiles()) == 22; assert rp.report_schema()['title']; assert rp.validation_report_schema()['properties']['schema_version']['const'] == 2; assert rp.project_schema()['properties']['schema_version']['const'] == 3"
          /tmp/researchplot-wheel/bin/python -c "import importlib.resources as r; root=r.files('researchplot'); assert root.joinpath('py.typed').is_file(); assert root.joinpath('web_assets','index.html').is_file(); assert root.joinpath('profile.schema.json').is_file()"
      - name: Install all wheel extras
        run: |
          python -m venv /tmp/researchplot-extras
          wheel="$(find dist -name '*.whl' -print -quit)"
          /tmp/researchplot-extras/bin/python -m pip install "${wheel}[plots,registry,web,manuscript,accessibility]"
          /tmp/researchplot-extras/bin/python -c "import pandas, scipy, seaborn, sklearn, tuf; import researchplot.plots"
      - name: Install and smoke-test sdist
        run: |
          python -m venv /tmp/researchplot-sdist
          /tmp/researchplot-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/researchplot-sdist/bin/python -c "import researchplot as rp; assert rp.resolve_profile('nature@2026.08.0').width_mm() == 89"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: dist/

  coverage:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,plots,registry]"
      - run: python -m pytest --cov-report=xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml

  visual-gallery:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: python examples/regression_gallery.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-regression-gallery
          path: build/regression-gallery/
