name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,plots]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.14"
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,plots]"
      - run: python -m pytest

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/researchplot-wheel
          /tmp/researchplot-wheel/bin/python -m pip install dist/*.whl
          /tmp/researchplot-wheel/bin/researchplot venues list
          /tmp/researchplot-wheel/bin/python -c "import researchplot as rp; assert len(rp.list_venues()) == 7"
      - name: Install and smoke-test sdist
        run: |
          python -m venv /tmp/researchplot-sdist
          /tmp/researchplot-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/researchplot-sdist/bin/python -c "import researchplot as rp; assert rp.resolve_venue('nature').width_mm() == 89"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  coverage:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,plots]"
      - run: python -m pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  visual-gallery:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: python examples/regression_gallery.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-regression-gallery
          path: build/regression-gallery/
