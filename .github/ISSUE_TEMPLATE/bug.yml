name: Compliance or audit bug
description: Report a false pass, false failure, crash, or inconsistent artifact result.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: result
    attributes:
      label: What happened?
      description: Include the verdict, phase coverage, rule ID, and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands or Python code. Attach a non-sensitive fixture when possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ResearchPlot version
      placeholder: researchplot --version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python, Matplotlib, artifact format, and optional capabilities.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed unpublished data, credentials, usernames, and private absolute paths.
          required: true
