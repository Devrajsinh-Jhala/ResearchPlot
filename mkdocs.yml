site_name: ResearchPlot
site_description: Source-backed venue compliance, artifact auditing, and submission bundles for research figures.
site_url: https://devrajsinh-jhala.github.io/ResearchPlot/
repo_url: https://github.com/Devrajsinh-Jhala/ResearchPlot
repo_name: Devrajsinh-Jhala/ResearchPlot
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Architecture: architecture.md
      - Compliance reports: compliance.md
      - Profiles and provenance: profiles.md
      - Accessibility: accessibility.md
  - Workflows:
      - Project configuration: configuration.md
      - Export and submission bundles: bundles.md
      - Command line: cli.md
      - Gallery: gallery.md
  - Reference:
      - Python API: api.md
      - Profile schema: profile-schema.md
      - Manifest and report formats: formats.md
      - Limitations and non-goals: limitations.md
  - Migrate from 0.2: migration.md
  - Contributing: contributing.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false

markdown_extensions:
  - pymdownx.snippets:
      check_paths: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

watch:
  - src/researchplot

exclude_docs: |
  _drafts/
