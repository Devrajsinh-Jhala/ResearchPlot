<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">ResearchPlot 2.0 coverage-aware compliance architecture</title>
  <desc id="desc">A schema-v3 project and locked source-backed profile compile into an evidence plan. Live, file, bundle, and manuscript observers feed phase coverage, a truthful verdict, and reproducible reports and bundles.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#e9fbf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4051b5"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #4051b5; stroke-width: 2; }
      .observe { fill: #e9fbf8; stroke: #00796b; }
      .coverage { fill: #fff7dd; stroke: #9a6700; }
      .output { fill: #f1ecff; stroke: #6f42c1; animation: output-pulse 3s ease-in-out infinite; }
      .label { fill: #1f2937; font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
      .small { fill: #4b5563; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
      .line { fill: none; stroke: #4051b5; stroke-width: 3; stroke-dasharray: 12 8; marker-end: url(#arrow); animation: evidence-flow 1.6s linear infinite; }
      @keyframes evidence-flow { to { stroke-dashoffset: -40; } }
      @keyframes output-pulse {
        0%, 100% { fill: #f1ecff; stroke-width: 2; }
        50% { fill: #e7dcff; stroke-width: 3; }
      }
      @media (prefers-reduced-motion: reduce) {
        .line, .output { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#background)"/>

  <rect class="box" x="28" y="45" width="205" height="82" rx="12"/>
  <text class="label" x="130" y="78">Locked profile</text>
  <text class="small" x="130" y="102">rules · sources · digest</text>

  <rect class="box" x="28" y="213" width="205" height="82" rx="12"/>
  <text class="label" x="130" y="246">Project schema v3</text>
  <text class="small" x="130" y="270">figures · files · metadata</text>

  <rect class="box" x="300" y="129" width="190" height="82" rx="12"/>
  <text class="label" x="395" y="162">Compliance plan</text>
  <text class="small" x="395" y="186">required phase coverage</text>

  <rect class="box observe" x="558" y="113" width="210" height="114" rx="12"/>
  <text class="label" x="663" y="147">Phase observers</text>
  <text class="small" x="663" y="173">live · file · bundle</text>
  <text class="small" x="663" y="196">compiled manuscript</text>

  <rect class="box coverage" x="836" y="45" width="190" height="82" rx="12"/>
  <text class="label" x="931" y="78">Coverage</text>
  <text class="small" x="931" y="102">pass · fail · unresolved</text>

  <rect class="box coverage" x="836" y="213" width="190" height="82" rx="12"/>
  <text class="label" x="931" y="246">Truthful verdict</text>
  <text class="small" x="931" y="270">compliant · non-compliant</text>
  <text class="small" x="931" y="287">· indeterminate</text>

  <rect class="box output" x="1060" y="129" width="112" height="82" rx="12"/>
  <text class="label" x="1116" y="158">Evidence</text>
  <text class="small" x="1116" y="180">reports</text>
  <text class="small" x="1116" y="197">+ bundles</text>

  <path class="line" d="M233 86 C270 86 270 145 300 157"/>
  <path class="line" d="M233 254 C270 254 270 195 300 183"/>
  <path class="line" d="M490 170 L558 170"/>
  <path class="line" d="M768 150 C802 142 808 104 836 91"/>
  <path class="line" d="M768 190 C802 198 808 236 836 249"/>
  <path class="line" d="M1026 86 C1050 96 1050 142 1060 153"/>
  <path class="line" d="M1026 254 C1050 244 1050 198 1060 187"/>
</svg>
